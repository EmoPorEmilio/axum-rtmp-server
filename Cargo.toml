[package]
name = "axum-rtmp-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "axum_rtmp_server"

[[bin]]
name = "axum-rtmp-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
bytes = "1.5"
dashmap = "5.5"
futures = "0.3"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
prometheus = "0.13"
notify = "6.1"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.4"
criterion = "0.5"
tempfile = "3.10"
reqwest = { version = "0.11", features = ["json"] }

[[bench]]
name = "chunk_parsing"
harness = false

[[bench]]
name = "amf_encoding"
harness = false
