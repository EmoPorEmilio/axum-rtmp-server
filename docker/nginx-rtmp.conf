worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

# RTMP configuration
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Application for receiving streams from our RTMP server
        application live {
            live on;
            record off;

            # Allow publishing from any source (for testing)
            allow publish all;
            allow play all;

            # Optional: create HLS stream for verification
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3;
            hls_playlist_length 60;

            # Notify on publish events (useful for testing)
            on_publish http://host.docker.internal:8080/on_publish;
        }

        # Second application to simulate multiple destinations
        application backup {
            live on;
            record off;
            allow publish all;
            allow play all;
        }
    }
}

# HTTP server for HLS playback and status
http {
    sendfile off;
    tcp_nopush on;
    directio 512;

    server {
        listen 8080;

        # RTMP statistics
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/share/nginx/html;
        }

        # HLS playback
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # Health check
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
