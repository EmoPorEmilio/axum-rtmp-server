name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo check
        run: cargo check --all-targets

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run unit tests
        run: cargo test --lib -- --nocapture

      - name: Run doc tests
        run: cargo test --doc

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start nginx-rtmp containers
        run: |
          docker-compose up -d nginx-rtmp-primary nginx-rtmp-backup
          sleep 5

      - name: Build and start RTMP server
        run: |
          docker-compose up -d --build rtmp-server
          sleep 5

      - name: Check RTMP server is running
        run: |
          curl -f http://localhost:8080/metrics || (docker-compose logs rtmp-server && exit 1)

      - name: Run integration tests
        env:
          RTMP_SERVER_ADDR: "127.0.0.1:1935"
          TEST_STREAM_KEY: "test-stream-key"
          PRIMARY_STATS_URL: "http://localhost:8081/stat"
          BACKUP_STATS_URL: "http://localhost:8082/stat"
          METRICS_URL: "http://localhost:8080/metrics"
        run: cargo test --test '*' -- --ignored --nocapture || true

      - name: Start test stream
        run: |
          docker-compose --profile test up -d ffmpeg-test
          sleep 15

      - name: Verify stream replication
        run: |
          echo "Checking primary destination..."
          curl -s http://localhost:8081/stat | head -50

          echo "Checking backup destination..."
          curl -s http://localhost:8082/stat | head -50

          echo "Checking metrics..."
          curl -s http://localhost:8080/metrics

      - name: Collect logs on failure
        if: failure()
        run: |
          docker-compose logs rtmp-server
          docker-compose logs nginx-rtmp-primary
          docker-compose logs nginx-rtmp-backup

      - name: Cleanup
        if: always()
        run: docker-compose down --remove-orphans

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [check, clippy, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: axum-rtmp-server-linux
          path: target/release/axum-rtmp-server

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: axum-rtmp-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Cross-platform builds
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test --lib

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test --lib
